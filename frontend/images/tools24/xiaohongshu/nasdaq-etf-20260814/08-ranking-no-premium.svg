<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101e"/><stop offset="1" stop-color="#1d1a5b"/></linearGradient>
    <linearGradient id="gold" x2="1"><stop stop-color="#ffb52e"/><stop offset="1" stop-color="#ffdf72"/></linearGradient>
    <linearGradient id="blue" x2="1"><stop stop-color="#19c9f5"/><stop offset="1" stop-color="#7667ff"/></linearGradient>
  </defs>
  <rect width="1200" height="1600" fill="url(#bg)"/>
  <text x="70" y="105" fill="#6fdcff" font-size="32" font-weight="700" font-family="-apple-system,PingFang SC,sans-serif">场内纳指100 ETF｜综合推荐排序</text>
  <text x="70" y="220" fill="white" font-size="82" font-weight="900" font-family="-apple-system,PingFang SC,sans-serif">不考虑溢价，优先看这5只</text>
  <text x="70" y="280" fill="#9fb1d3" font-size="29" font-family="-apple-system,PingFang SC,sans-serif">主要比较：固定费率 · 基金规模 · 30日万元收益差 · 数据稳定性</text>
  <g font-family="-apple-system,PingFang SC,sans-serif">
    <g transform="translate(70 345)"><rect width="1060" height="220" rx="38" fill="#153b52" stroke="#38ddff" stroke-width="3"/><circle cx="82" cy="76" r="51" fill="url(#gold)"/><text x="82" y="94" text-anchor="middle" fill="#402b00" font-size="50" font-weight="900">1</text><text x="160" y="78" fill="white" font-size="48" font-weight="900">159659 招商</text><text x="1010" y="78" text-anchor="end" fill="#66e6ff" font-size="35" font-weight="800">综合首选</text><text x="160" y="145" fill="#c7deeb" font-size="30">费率0.65%｜规模108.68亿｜30日万元收益差 -44元</text><text x="160" y="193" fill="#66e6ff" font-size="27" font-weight="700">低费率、百亿规模、短期跟踪结果较好，最均衡</text></g>
    <g transform="translate(70 595)"><rect width="1060" height="190" rx="34" fill="#172d54"/><circle cx="76" cy="66" r="44" fill="#bac7db"/><text x="76" y="82" text-anchor="middle" fill="#1b2940" font-size="43" font-weight="900">2</text><text x="145" y="70" fill="white" font-size="44" font-weight="850">159501 嘉实</text><text x="1010" y="70" text-anchor="end" fill="#74e3c6" font-size="32" font-weight="800">长期低费</text><text x="145" y="130" fill="#c2cee2" font-size="30">费率0.60%｜规模142.85亿｜收益差 -67元</text><text x="145" y="173" fill="#7bdfc7" font-size="26">最低费率档里规模优势最明显</text></g>
    <g transform="translate(70 815)"><rect width="1060" height="190" rx="34" fill="#20285a"/><circle cx="76" cy="66" r="44" fill="#d69b58"/><text x="76" y="82" text-anchor="middle" fill="#39230b" font-size="43" font-weight="900">3</text><text x="145" y="70" fill="white" font-size="44" font-weight="850">513100 国泰</text><text x="1010" y="70" text-anchor="end" fill="#bca9ff" font-size="32" font-weight="800">跟踪表现</text><text x="145" y="130" fill="#c9cde6" font-size="30">费率0.80%｜规模214.29亿｜收益差 -18元</text><text x="145" y="173" fill="#bca9ff" font-size="26">30日万元收益差最接近基准，规模第二</text></g>
    <g transform="translate(70 1035)"><rect width="1060" height="175" rx="34" fill="#173b48"/><circle cx="76" cy="63" r="42" fill="#36c4ac"/><text x="76" y="78" text-anchor="middle" fill="#0d3931" font-size="41" font-weight="900">4</text><text x="142" y="67" fill="white" font-size="42" font-weight="850">159632 华安</text><text x="1010" y="67" text-anchor="end" fill="#78e9d4" font-size="30" font-weight="800">稳健备选</text><text x="142" y="124" fill="#c1d8dc" font-size="29">费率0.80%｜规模124.06亿｜收益差 -71元</text><text x="142" y="162" fill="#78e9d4" font-size="25">规模与跟踪结果均处于中上水平</text></g>
    <g transform="translate(70 1240)"><rect width="1060" height="175" rx="34" fill="#372650"/><circle cx="76" cy="63" r="42" fill="#8b69cf"/><text x="76" y="78" text-anchor="middle" fill="white" font-size="41" font-weight="900">5</text><text x="142" y="67" fill="white" font-size="42" font-weight="850">159941 广发</text><text x="1010" y="67" text-anchor="end" fill="#d2b9ff" font-size="30" font-weight="800">规模优先</text><text x="142" y="124" fill="#d6cce2" font-size="29">费率1.00%｜规模382.71亿｜收益差 -28元</text><text x="142" y="162" fill="#d2b9ff" font-size="25">规模最大、跟踪较好，但固定费率最高</text></g>
  </g>
  <rect x="70" y="1445" width="1060" height="100" rx="26" fill="#0a1933" stroke="#39598c"/>
  <text x="600" y="1487" text-anchor="middle" fill="white" font-size="28" font-weight="700" font-family="-apple-system,PingFang SC,sans-serif">近119个有效历史样本：11只产品全部交易日为正溢价</text>
  <text x="600" y="1525" text-anchor="middle" fill="#75dfff" font-size="25" font-family="-apple-system,PingFang SC,sans-serif">中位溢价约4.17%—7.12%｜溢价不参与本次产品排序</text>
  <text x="70" y="1582" fill="#7f90af" font-size="22" font-family="-apple-system,PingFang SC,sans-serif">2026-08-14盘后数据｜排序反映指定指标偏好，不构成投资建议</text>
</svg>
