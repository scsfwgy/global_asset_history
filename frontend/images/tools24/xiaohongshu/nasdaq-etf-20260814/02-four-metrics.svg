<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#061020"/><stop offset="1" stop-color="#0d2555"/></linearGradient></defs>
  <rect width="1200" height="1600" fill="url(#bg)"/>
  <text x="74" y="125" fill="#65dfff" font-size="34" font-weight="700" font-family="-apple-system,PingFang SC,sans-serif">02｜先别急着问“哪只最好”</text>
  <text x="70" y="250" fill="white" font-size="82" font-weight="900" font-family="-apple-system,PingFang SC,sans-serif">至少同时看4个维度</text>
  <g font-family="-apple-system,PingFang SC,sans-serif">
    <g transform="translate(70 340)"><rect width="505" height="420" rx="42" fill="#112b5a" stroke="#21c7ff" stroke-width="3"/><circle cx="92" cy="92" r="48" fill="#13bff1"/><text x="92" y="109" text-anchor="middle" fill="white" font-size="46" font-weight="900">1</text><text x="62" y="200" fill="white" font-size="56" font-weight="850">溢价率</text><text x="62" y="275" fill="#b7c9ea" font-size="34">决定你此刻买入</text><text x="62" y="323" fill="#b7c9ea" font-size="34">有没有“买贵”</text><text x="62" y="382" fill="#5be2ff" font-size="31" font-weight="700">短期最值得先看</text></g>
    <g transform="translate(625 340)"><rect width="505" height="420" rx="42" fill="#20205d" stroke="#8e70ff" stroke-width="3"/><circle cx="92" cy="92" r="48" fill="#7958ed"/><text x="92" y="109" text-anchor="middle" fill="white" font-size="46" font-weight="900">2</text><text x="62" y="200" fill="white" font-size="56" font-weight="850">固定费率</text><text x="62" y="275" fill="#c8c2ed" font-size="34">管理费 + 托管费</text><text x="62" y="323" fill="#c8c2ed" font-size="34">长期每年持续发生</text><text x="62" y="382" fill="#ad9cff" font-size="31" font-weight="700">长期持有更敏感</text></g>
    <g transform="translate(70 810)"><rect width="505" height="420" rx="42" fill="#123a3b" stroke="#35dfaa" stroke-width="3"/><circle cx="92" cy="92" r="48" fill="#21b987"/><text x="92" y="109" text-anchor="middle" fill="white" font-size="46" font-weight="900">3</text><text x="62" y="200" fill="white" font-size="56" font-weight="850">基金规模</text><text x="62" y="275" fill="#b9dfd8" font-size="34">观察产品体量</text><text x="62" y="323" fill="#b9dfd8" font-size="34">配合成交额看流动性</text><text x="62" y="382" fill="#70e7be" font-size="31" font-weight="700">大不等于便宜</text></g>
    <g transform="translate(625 810)"><rect width="505" height="420" rx="42" fill="#452334" stroke="#ff6b9b" stroke-width="3"/><circle cx="92" cy="92" r="48" fill="#e84e7f"/><text x="92" y="109" text-anchor="middle" fill="white" font-size="46" font-weight="900">4</text><text x="62" y="200" fill="white" font-size="56" font-weight="850">收益差</text><text x="62" y="275" fill="#e8c1ce" font-size="34">相同指数不代表</text><text x="62" y="323" fill="#e8c1ce" font-size="34">实际收益完全一样</text><text x="62" y="382" fill="#ff91b4" font-size="31" font-weight="700">观察跟踪结果</text></g>
  </g>
  <rect x="70" y="1300" width="1060" height="165" rx="36" fill="#0a1835" stroke="#315288"/>
  <text x="600" y="1370" text-anchor="middle" fill="white" font-size="42" font-weight="750" font-family="-apple-system,PingFang SC,sans-serif">单看一个指标，很容易得出错误结论</text>
  <text x="600" y="1425" text-anchor="middle" fill="#7fdfff" font-size="30" font-family="-apple-system,PingFang SC,sans-serif">数据快照：2026-08-14 盘后</text>
  <text x="70" y="1530" fill="#8294b8" font-size="28" font-family="-apple-system,PingFang SC,sans-serif">QQQ Tools｜仅作数据研究，不构成投资建议</text>
</svg>
